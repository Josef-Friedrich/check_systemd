[project]
name = "check_systemd"
version = "5.0.0"
description = "Nagios / Icinga monitoring plugin to check systemd for failed units."
authors = [{ name = "Josef Friedrich", email = "josef@friedrich.rocks" }]
requires-python = ">=3.9,<4"
readme = "README.rst"
license = "LGPL-2.1-only"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["nagiosplugin>=1.2,<2"]

[project.urls]
Repository = "https://github.com/Josef-Friedrich/check_systemd"

[project.scripts]
check_systemd = "check_systemd:main"

[dependency-groups]
dev = [
    "nagiosplugin-stubs>=0.6.4,<0.7",
    "pygobject-stubs>=2,<3",
    "pytest>=8,<9",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "check_systemd"
module-root = ""
namespace = true

[tool.pyright]
reportMissingModuleSource = false
reportPrivateImportUsage = "none"
reportUnusedImport = "information"
reportUnusedExpression = "information"
reportImportCycles = "information"
